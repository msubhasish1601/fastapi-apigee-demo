<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apigee API Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 1.75rem;
            margin-bottom: 1.25rem;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #a78bfa;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(167,139,250,0.2);
        }

        .form-row { display: flex; gap: 1rem; }
        .form-group { margin-bottom: 1rem; flex: 1; }
        .form-group:last-child { margin-bottom: 0; }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }

        input, select {
            width: 100%;
            padding: 0.65rem 0.9rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167,139,250,0.15);
        }
        input::placeholder { color: #475569; }

        .mode-toggle {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .mode-btn {
            flex: 1;
            padding: 0.55rem;
            border: none;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            background: transparent;
            color: #64748b;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            box-shadow: 0 2px 8px rgba(124,58,237,0.4);
        }
        .mode-hint {
            font-size: 0.78rem;
            color: #64748b;
            margin-bottom: 1rem;
            padding: 0.6rem 0.9rem;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border-left: 3px solid #7c3aed;
        }
        .mode-hint.warn { border-left-color: #f59e0b; color: #fbbf24; }

        button.btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            margin-top: 0.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 15px rgba(124,58,237,0.4); }
        .btn-green {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
        }
        .btn-green:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 15px rgba(16,185,129,0.4); }

        .token-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            word-break: break-all;
            color: #34d399;
        }

        .result-box {
            background: #0d1117;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 120px;
            max-height: 350px;
            overflow-y: auto;
            color: #94a3b8;
        }
        .result-box.success { border-color: rgba(52, 211, 153, 0.3); color: #34d399; }
        .result-box.error { border-color: rgba(239, 68, 68, 0.3); color: #f87171; }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        .badge-green { background: rgba(16,185,129,0.2); color: #34d399; }
        .badge-purple { background: rgba(124,58,237,0.2); color: #a78bfa; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🚀 Apigee API Tester</h1>
        <p>Test your FastAPI + Apigee architecture from the browser</p>
    </div>

    <!-- Config Card -->
    <div class="card">
        <div class="card-title">⚙️ Configuration</div>

        <div style="margin-bottom: 1rem;">
            <label style="margin-bottom: 0.6rem; display: block;">Test Mode</label>
            <div class="mode-toggle">
                <button class="mode-btn active" id="modeDirect" onclick="setMode('direct')">
                    ✅ Direct (Render) — Browser
                </button>
                <button class="mode-btn" id="modeApigee" onclick="setMode('apigee')">
                    🔒 Via Apigee Gateway
                </button>
            </div>
            <div class="mode-hint" id="modeHint">
                Calling Render directly. CORS works perfectly here. Use this for browser testing.
            </div>
        </div>

        <div class="form-group" id="renderUrlGroup">
            <label>Render Backend URL <span class="badge badge-green">CORS OK</span></label>
            <input type="text" id="renderUrl" value="https://fastapi-apigee-demo.onrender.com/api/v1">
        </div>

        <div class="form-group" id="apigeeUrlGroup" style="display:none;">
            <label>Apigee Gateway URL <span class="badge badge-purple">Requires x-api-key</span></label>
            <input type="text" id="apigeeUrl" value="https://136.82.119.222.nip.io/api/v1">
        </div>

        <div class="form-group" id="apiKeyGroup" style="display:none;">
            <label>Apigee API Key (x-api-key)</label>
            <input type="password" id="apiKey" placeholder="Paste your Apigee Consumer Key">
        </div>
    </div>

    <!-- Auth Card -->
    <div class="card">
        <div class="card-title">🔑 Step 1 — Authenticate</div>
        <div class="form-row">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" value="admin@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" value="Welcome1@">
            </div>
        </div>
        <button class="btn btn-primary" onclick="login()">Login & Get JWT Token</button>

        <div id="tokenSection" style="display:none; margin-top: 1rem;">
            <label>✅ JWT Token Received</label>
            <div class="token-display" id="tokenDisplay"></div>
        </div>
    </div>

    <!-- Customers Card -->
    <div class="card">
        <div class="card-title">👥 Step 2 — Fetch Secure Data</div>
        <button class="btn btn-green" onclick="fetchCustomers()">Fetch Customers (Protected Endpoint)</button>
    </div>

    <!-- Response Card -->
    <div class="card">
        <div class="card-title">📄 Response</div>
        <div class="result-box" id="resultOutput">Awaiting action...</div>
    </div>
</div>

<script>
    let currentMode = 'direct';
    let jwtToken = '';

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeDirect').classList.toggle('active', mode === 'direct');
        document.getElementById('modeApigee').classList.toggle('active', mode === 'apigee');

        const hint = document.getElementById('modeHint');
        const apiKeyGroup = document.getElementById('apiKeyGroup');
        const apigeeUrlGroup = document.getElementById('apigeeUrlGroup');
        const renderUrlGroup = document.getElementById('renderUrlGroup');

        if (mode === 'direct') {
            renderUrlGroup.style.display = 'block';
            apigeeUrlGroup.style.display = 'none';
            apiKeyGroup.style.display = 'none';
            hint.className = 'mode-hint';
            hint.textContent = 'Calling Render directly. CORS works perfectly here. Use this for browser testing.';
        } else {
            renderUrlGroup.style.display = 'none';
            apigeeUrlGroup.style.display = 'block';
            apiKeyGroup.style.display = 'block';
            hint.className = 'mode-hint warn';
            hint.textContent = '⚠️ Apigee mode may have CORS issues in the browser. Use curl or Postman for Apigee testing.';
        }
    }

    function getBaseUrl() {
        return currentMode === 'direct'
            ? document.getElementById('renderUrl').value.trim()
            : document.getElementById('apigeeUrl').value.trim();
    }

    function getHeaders(includeAuth = false) {
        const headers = { 'Content-Type': 'application/json' };
        if (currentMode === 'apigee') {
            const key = document.getElementById('apiKey').value.trim();
            if (key) headers['x-api-key'] = key;
        }
        if (includeAuth && jwtToken) {
            headers['Authorization'] = `Bearer ${jwtToken}`;
        }
        return headers;
    }

    function setResult(data, isError = false) {
        const box = document.getElementById('resultOutput');
        box.textContent = JSON.stringify(data, null, 2);
        box.className = 'result-box ' + (isError ? 'error' : 'success');
    }

    async function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        document.getElementById('resultOutput').textContent = 'Authenticating...';
        document.getElementById('resultOutput').className = 'result-box';

        try {
            const response = await fetch(`${getBaseUrl()}/auth/token`, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok && data.access_token) {
                jwtToken = data.access_token;
                document.getElementById('tokenSection').style.display = 'block';
                document.getElementById('tokenDisplay').textContent = jwtToken.substring(0, 60) + '...';
                setResult({ message: '✅ Login successful! Token stored.', token_preview: jwtToken.substring(0, 60) + '...' });
            } else {
                setResult(data, true);
            }
        } catch (err) {
            setResult({ error: err.message, suggestion: 'If using Apigee mode, try Direct mode instead for browser testing.' }, true);
        }
    }

    async function fetchCustomers() {
        if (!jwtToken) {
            setResult({ error: 'Please login first to get a JWT token!' }, true);
            return;
        }

        document.getElementById('resultOutput').textContent = 'Fetching customers...';
        document.getElementById('resultOutput').className = 'result-box';

        try {
            const response = await fetch(`${getBaseUrl()}/customers/`, {
                method: 'GET',
                headers: getHeaders(true)
            });

            const data = await response.json();
            setResult(data, !response.ok);
        } catch (err) {
            setResult({ error: err.message }, true);
        }
    }
</script>
</body>
</html>
