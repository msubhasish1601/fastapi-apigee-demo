<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apigee API Tester</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 1rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
        }

        .section-title {
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Apigee API Tester</h1>

    <div class="form-group">
        <label>Apigee Base URL</label>
        <input type="text" id="baseUrl" value="https://136.82.119.222.nip.io/api/v1" placeholder="https://YOUR_IP.nip.io/api/v1">
    </div>
    
    <div class="form-group">
        <label>Apigee API Key (x-api-key)</label>
        <input type="password" id="apiKey" placeholder="Paste your Apigee Consumer Key here">
    </div>

    <div class="section-title">1. Authenticate (Get JWT)</div>
    
    <div style="display: flex; gap: 1rem;">
        <div class="form-group" style="flex: 1;">
            <label>Email</label>
            <input type="email" id="email" value="admin@example.com">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Password</label>
            <input type="password" id="password" value="Welcome1@">
        </div>
    </div>
    <button onclick="login()">Login & Get Token</button>

    <div class="form-group">
        <label>JWT Bearer Token</label>
        <input type="text" id="jwtToken" placeholder="Token will appear here after login" readonly style="background: #f3f4f6;">
    </div>

    <div class="section-title">2. Fetch Secure Data</div>
    <button onclick="fetchCustomers()" style="background-color: #10b981;">Fetch Customers</button>

    <div class="section-title">Response:</div>
    <div class="result-box" id="resultOutput">Awaiting action...</div>
</div>

<script>
    function logResult(data) {
        document.getElementById('resultOutput').textContent = JSON.stringify(data, null, 2);
    }

    async function login() {
        const baseUrl = document.getElementById('baseUrl').value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!apiKey) {
            alert("Please enter your Apigee API Key first!");
            return;
        }

        logResult("Logging in...");

        try {
            const response = await fetch(`${baseUrl}/auth/token`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            logResult(data);

            if (response.ok && data.access_token) {
                document.getElementById('jwtToken').value = data.access_token;
            }
        } catch (error) {
            logResult({ error: error.message, tip: "Check console and ensure CORS is enabled on Apigee/Render." });
        }
    }

    async function fetchCustomers() {
        const baseUrl = document.getElementById('baseUrl').value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();
        const jwtToken = document.getElementById('jwtToken').value.trim();

        if (!apiKey || !jwtToken) {
            alert("You need both an API Key and a JWT token (login first)!");
            return;
        }

        logResult("Fetching customers...");

        try {
            const response = await fetch(`${baseUrl}/customers/`, {
                method: 'GET',
                headers: {
                    'x-api-key': apiKey,
                    'Authorization': `Bearer ${jwtToken}`
                }
            });

            const data = await response.json();
            logResult(data);
        } catch (error) {
            logResult({ error: error.message });
        }
    }
</script>

</body>
</html>
